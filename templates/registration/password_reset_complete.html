{% extends "registration/base_auth.html" %}

{% block title %}Senha Atualizada — skdnote{% endblock %}

{% block auth_content %}
<div style="text-align: center; padding: 12px 0;">
    <div class="state-icon-circle state-icon-success">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
    </div>

    <div class="auth-header" style="margin-bottom: 24px;">
        <h1>Senha atualizada com sucesso!</h1>
        <p>Sua nova senha foi salva. Você já pode acessar suas anotações com as novas credenciais.</p>
    </div>

    <a href="{% url 'login' %}" class="btn btn-primary btn-block">
        Entrar no skdnote
    </a>
</div>
{% endblock %}
