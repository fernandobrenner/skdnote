{% extends "registration/base_auth.html" %}

{% block title %}Senha Alterada — skdnote{% endblock %}

{% block auth_content %}
<div style="text-align: center; padding: 12px 0;">
    <div class="state-icon-circle state-icon-success">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
    </div>

    <div class="auth-header" style="margin-bottom: 24px;">
        <h1>Senha alterada com sucesso!</h1>
        <p>Sua senha foi redefinida com segurança. Suas próximas sessões deverão usar esta nova chave.</p>
    </div>

    <a href="{% url 'notes:app' %}" class="btn btn-primary btn-block">
        Voltar para o aplicativo
    </a>
</div>
{% endblock %}
