{% extends "registration/base_auth.html" %}

{% block title %}Sessão Encerrada — skdnote{% endblock %}

{% block auth_content %}
<div style="text-align: center; padding: 12px 0;">
    <div class="state-icon-circle state-icon-info">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
    </div>

    <div class="auth-header" style="margin-bottom: 24px;">
        <h1>Sessão encerrada</h1>
        <p>Você saiu da sua conta do skdnote com total segurança.</p>
    </div>

    <a href="{% url 'login' %}" class="btn btn-primary btn-block">
        Fazer Login Novamente
    </a>
</div>
{% endblock %}
